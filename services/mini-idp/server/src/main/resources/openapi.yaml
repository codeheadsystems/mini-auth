openapi: 3.1.0
info:
  title: mini-idp
  version: "1.0.0"
  description: |
    **mini-idp** is a small identity provider. It issues short-lived signed JWT access
    tokens (Ed25519 by default; ES256 for audiences an operator maps to it) via the OAuth 2.0
    client-credentials grant, and publishes its public signing keys (JWKS)
    so a verifier (the companion **mini-kms** service) can validate tokens **offline**. Service
    accounts (the OAuth clients) are **not** managed here — they live in **mini-directory**, the
    family's single source of service-account identity; mini-idp resolves a client's credentials and
    grants from mini-directory at token issuance.

    This document is the authoritative contract: a verifier can integrate against it without
    reading mini-idp source. It describes the token endpoint, the JWKS shape, the discovery
    document, mini-idp's own admin API (key rotation, revocation, audit), and — most importantly for
    integrators — the **JWT claim schema** (see the `JwtClaims` schema), whose `grants` claim maps
    cleanly onto mini-kms's `Principal` / `KeyOperation` model. (To create or manage clients, use
    mini-directory's `/admin/service-accounts` API.)

    ## Audiences and algorithms (per token)
    By default a token carries the configured default audience (`mini-kms`) and is signed with
    `EdDSA` (Ed25519), exactly as always. A client may instead ask for another audience with the
    RFC 8707 `resource` parameter (or the equivalent `audience` parameter); it must be on that
    client's allowlist (`token:audience` grants in mini-directory, or `audiences` in the seed), else
    `400 invalid_target`. The operator can map an audience to `ES256` (ECDSA P-256), e.g. for
    config-server, whose JOSE stack does not accept EdDSA; such tokens are signed by a separate
    ES256 key set published in the same JWKS.

    ## Discovery
    The same document is served at `/.well-known/openid-configuration` (OpenID Connect Discovery
    1.0), `/.well-known/oauth-authorization-server` (RFC 8414) and `/.well-known/idp-configuration`.

    ## Token verification (what a verifier does)
    1. Fetch `GET /.well-known/jwks.json` (or discover it via `jwks_uri`) and cache it.
    2. For a presented token, read the JWS header `kid`, select the matching JWK, and verify the
       signature over `base64url(header) "." base64url(payload)` with the algorithm the verifier
       expects for that key: `EdDSA` for `OKP`/`Ed25519` keys, `ES256` for `EC`/`P-256` keys (raw
       64-byte `R || S`). Never let the token's own `alg` choose the verification algorithm.
    3. Validate `iss`, `aud`, and the `nbf`/`exp` time window.
    4. Optionally poll `GET /admin/revocations` and reject any token whose `jti` is listed.
    5. Map `sub` → `Principal.id`, `grants.control` → `Principal.admin`, and each
       `grants.groups[]` entry → a per-key-group authorization decision.
servers:
  - url: http://127.0.0.1:8455
    description: Default loopback bind address.

tags:
  - name: oauth
    description: Token issuance and OAuth/OIDC-style discovery.
  - name: jwks
    description: Public signing keys for offline verification.
  - name: admin
    description: Operator API, guarded by the bootstrap admin bearer token.
  - name: meta
    description: Health and the served specification.

paths:
  /oauth/token:
    post:
      tags: [oauth]
      summary: Issue an access token (client-credentials grant)
      description: |
        Authenticates a client by `client_id` + `client_secret` (sent either as form fields —
        `client_secret_post` — or via HTTP Basic — `client_secret_basic`) and returns a signed JWT.
        On any authentication failure a single generic `invalid_client` error is returned with no
        detail distinguishing an unknown client from a wrong secret (no credential oracle).

        The token's audience is the default unless the client names one with `resource` or
        `audience`; a named audience other than the default must be on the client's allowlist,
        else `400 invalid_target` (checked only after the client authenticated). The audience
        selects the signing algorithm (`EdDSA` unless the operator mapped it to `ES256`).
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                  description: Required unless supplied via HTTP Basic.
                client_secret:
                  type: string
                  description: Required unless supplied via HTTP Basic.
                scope:
                  type: string
                  description: Optional and currently advisory; granted scope is determined by the client's stored grants.
                resource:
                  type: string
                  description: |
                    RFC 8707 resource indicator: the audience (`aud`) this token is for, e.g.
                    `config-server`. Omit for the default audience. Must be the default or on the
                    client's audience allowlist. One value per request.
                audience:
                  type: string
                  description: Same as `resource`; if both are sent they must be equal.
      responses:
        "200":
          description: A signed access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: |
            Missing or unsupported grant (`unsupported_grant_type`), or a requested audience the
            client may not have (`invalid_target`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Client authentication failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /.well-known/jwks.json:
    get:
      tags: [jwks]
      summary: Public signing keys (JWK Set)
      description: |
        The current public signing keys, per algorithm: the active key, the **next** key (published
        before it signs anything, so a verifier's cached JWKS already holds the kid that signs after
        the next rotation), and recently retired keys (so tokens signed before a rotation still
        verify until they expire).
      responses:
        "200":
          description: The JWK Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }

  /.well-known/idp-configuration:
    get:
      tags: [oauth]
      summary: Discovery document
      description: Issuer, token endpoint, and JWKS URI, plus supported grant/auth/alg values.
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDocument" }

  /.well-known/openid-configuration:
    get:
      tags: [oauth]
      summary: Discovery document (OpenID Connect Discovery 1.0 location)
      description: |
        The same document as `/.well-known/idp-configuration`, at the standard location verifiers
        such as config-server fetch (`<issuer>/.well-known/openid-configuration`). `issuer` equals
        every token's `iss` exactly; `jwks_uri` names the JWKS.
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDocument" }

  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: Discovery document (RFC 8414 location)
      description: The same document as `/.well-known/openid-configuration`.
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDocument" }

  /health:
    get:
      tags: [meta]
      summary: Liveness check
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /openapi.yaml:
    get:
      tags: [meta]
      summary: This specification, as YAML
      responses:
        "200":
          description: The OpenAPI document (YAML).
          content:
            application/yaml:
              schema: { type: string }

  /openapi.json:
    get:
      tags: [meta]
      summary: This specification, as JSON
      responses:
        "200":
          description: The OpenAPI document (JSON).
          content:
            application/json:
              schema: { type: object }

  /docs:
    get:
      tags: [meta]
      summary: Swagger UI
      description: Human-facing Swagger UI rendering this specification (assets are vendored).
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema: { type: string }

  /admin/keys/rotate:
    post:
      tags: [admin]
      summary: Rotate the signing key
      description: |
        For every algorithm in use (Ed25519 always; ES256 when an audience is mapped to it),
        activates the pre-published next key and publishes a fresh next key. Each previous key is
        retired but stays published in the JWKS until every token it could have signed has expired.
      security:
        - adminBearer: []
      responses:
        "200":
          description: The new active key id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeKid:
                    type: string
                    description: The new active Ed25519 (EdDSA) key id.
                  activeKids:
                    type: object
                    description: The new active key id per JWS algorithm, e.g. `{"EdDSA":"…","ES256":"…"}`.
                    additionalProperties: { type: string }
        "401":
          description: Missing or invalid admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/revocations:
    post:
      tags: [admin]
      summary: Revoke a token id (jti)
      description: |
        Adds a `jti` to the pollable denylist. Short TTLs are the primary control; this kills a
        specific outstanding token before its `exp`.
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationRequest" }
      responses:
        "201":
          description: The recorded revocation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revocation" }
        "400":
          description: Missing jti.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [admin]
      summary: The current revocation denylist
      description: The active (un-expired) revocations, for a verifier to poll.
      security:
        - adminBearer: []
      responses:
        "200":
          description: The denylist.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Revocation" }
        "401":
          description: Missing or invalid admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/audit:
    get:
      tags: [admin]
      summary: Audit log
      description: Issuance / grant / revocation / rotation / client lifecycle entries, oldest first.
      security:
        - adminBearer: []
      responses:
        "200":
          description: The audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401":
          description: Missing or invalid admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: "The bootstrap admin token, presented as `Authorization: Bearer <token>`."
    clientSecretBasic:
      type: http
      scheme: basic
      description: "Client credentials as HTTP Basic (`client_id`:`client_secret`)."

  schemas:
    Error:
      type: object
      description: OAuth-style error body.
      properties:
        error: { type: string }
        error_description: { type: string }
      required: [error]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The compact JWS (see JwtClaims for the decoded payload).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime in seconds.
        scope:
          type: string
          description: Space-delimited summary of granted access (`group:OPERATION` entries, plus `control`).
      required: [access_token, token_type, expires_in]

    JwtClaims:
      type: object
      description: |
        The decoded payload of an issued access token (the published token claim schema). The token
        itself is a compact Ed25519 JWS with header `{"alg":"EdDSA","typ":"JWT","kid":"<kid>"}`.
      properties:
        iss:
          type: string
          description: Issuer URL.
        sub:
          type: string
          description: The clientId. Maps to mini-kms `Principal.id`.
        aud:
          type: string
          description: |
            The intended audience: the configured default (the mini-kms service) unless the client
            requested another allowlisted audience (`resource` / `audience`), e.g. `config-server`.
        iat:
          type: integer
          description: Issued-at (epoch seconds).
        nbf:
          type: integer
          description: Not-before (epoch seconds).
        exp:
          type: integer
          description: Expiry (epoch seconds).
        jti:
          type: string
          description: Unique token id (used for revocation).
        grants:
          $ref: "#/components/schemas/GrantsClaim"
        cnf:
          type: object
          description: |
            OPTIONAL confirmation claim (RFC 7800), reserved for future channel binding (e.g. an
            mTLS thumbprint `x5t#S256` or a peer uid). Not populated or enforced yet.
          additionalProperties: true
      required: [iss, sub, aud, iat, nbf, exp, jti, grants]

    GrantsClaim:
      type: object
      description: |
        The authorization payload. `control` maps to mini-kms `Principal.admin`; each `groups[]`
        entry maps to a per-key-group `PolicyEngine` decision (mini-policy) for that key group.
      properties:
        control:
          type: boolean
          description: Whether the client holds control-plane (admin) authority.
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupGrant" }
      required: [control, groups]

    GroupGrant:
      type: object
      properties:
        keyGroup:
          type: string
          description: The key-group identifier.
        operations:
          type: array
          description: Granted operations; names match mini-kms `KeyOperation`.
          items:
            type: string
            enum: [GENERATE_DATA_KEY, ENCRYPT, DECRYPT, RE_ENCRYPT]
      required: [keyGroup, operations]

    Jwk:
      type: object
      description: |
        A public signing key in JWK form: Ed25519 (`kty=OKP`, RFC 8037) or, when ES256 is in use,
        EC P-256 (`kty=EC`, RFC 7518 §6.2).
      properties:
        kty: { type: string, enum: [OKP, EC] }
        crv: { type: string, enum: [Ed25519, P-256] }
        x:
          type: string
          description: |
            Ed25519 - the raw 32-byte public key; EC - the 32-byte x coordinate. base64url (unpadded).
        y:
          type: string
          description: EC only - the 32-byte y coordinate, base64url (unpadded).
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [EdDSA, ES256] }
        kid: { type: string }
      required: [kty, crv, x, kid]

    JwkSet:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
      required: [keys]

    DiscoveryDocument:
      type: object
      properties:
        issuer: { type: string }
        token_endpoint: { type: string }
        jwks_uri: { type: string }
        grant_types_supported:
          type: array
          items: { type: string }
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string }
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
      required: [issuer, token_endpoint, jwks_uri]

    RevocationRequest:
      type: object
      properties:
        jti: { type: string }
        expiresAt:
          type: integer
          description: The revoked token's exp (epoch seconds). Optional; defaults to now + token TTL.
        reason: { type: string }
      required: [jti]

    Revocation:
      type: object
      properties:
        jti: { type: string }
        revokedAt: { type: integer, description: Epoch seconds. }
        expiresAt: { type: integer, description: Epoch seconds; entry prunable after this. }
        reason: { type: string }
      required: [jti, revokedAt, expiresAt]

    AuditEntry:
      type: object
      properties:
        at: { type: integer, description: Epoch seconds. }
        event: { type: string, description: "e.g. token.issued, client.registered, key.rotated." }
        clientId: { type: string }
        detail: { type: string }
      required: [at, event]
