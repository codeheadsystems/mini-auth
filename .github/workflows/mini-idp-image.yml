# Builds the mini-idp container image and, on a release tag, publishes it to GitHub Container
# Registry as ghcr.io/codeheadsystems/mini-idp.
#
#   - pull requests / pushes to main that touch mini-idp or its libraries: build the image (both
#     architectures) and smoke-test it; nothing is pushed.
#   - a tag `mini-idp-vX.Y.Z`: test, build and push `ghcr.io/codeheadsystems/mini-idp:X.Y.Z`
#     (plus `X.Y`; pre-release tags such as `mini-idp-v0.2.0-rc.1` push only that exact version).
#
# The image is what other projects' integration tests (Testcontainers) run; see
# services/mini-idp/README.md, "Container image".
name: mini-idp image

on:
  push:
    branches: [main]
    tags: ["mini-idp-v*"]
    paths:
      - "services/mini-idp/**"
      - "services/mini-kms/**"
      - "libs/mini-token/**"
      - "libs/mini-policy/**"
      - "gradle/**"
      - "build-logic/**"
      - ".github/workflows/mini-idp-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/mini-idp/**"
      - "services/mini-kms/**"
      - "libs/mini-token/**"
      - "libs/mini-policy/**"
      - "gradle/**"
      - "build-logic/**"
      - ".github/workflows/mini-idp-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/codeheadsystems/mini-idp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The issuer's own tests, including the config-server compatibility test, gate the image.
      - name: Test mini-idp and build the distribution
        run: >
          ./gradlew --stacktrace
          :libs:mini-token:test
          :services:mini-idp:server:test
          :services:mini-idp:testkit:test
          :services:mini-idp:server:installDist

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=mini-idp-v(.*),group=1
            type=match,pattern=mini-idp-v(\d+\.\d+)\.\d+$,group=1
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=mini-idp
            org.opencontainers.image.description=mini-idp machine-identity token issuer (OAuth 2.0 client credentials)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Smoke test: load the native-arch image, start it the way an integration test would, and
      # check discovery and a token for the ES256-mapped audience.
      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: services/mini-idp/server/build/install/server
          file: services/mini-idp/docker/Dockerfile
          build-contexts: docker=services/mini-idp/docker
          load: true
          tags: mini-idp:smoke

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:18455:18455 \
            -e MINIIDP_PORT=18455 -e MINIIDP_ADMIN_TOKEN=smoke-admin \
            -e MINIIDP_AUDIENCE_ALGORITHMS=config-server=ES256 \
            -e 'MINIIDP_SERVICE_ACCOUNTS=[{"clientId":"smoke","secret":"smoke-secret","audiences":["config-server"]}]' \
            mini-idp:smoke
          for i in $(seq 1 60); do curl -sf http://localhost:18455/health && break; sleep 1; done
          curl -sf http://localhost:18455/.well-known/openid-configuration \
            | grep -q '"issuer" : "http://localhost:18455"'
          curl -sf -d grant_type=client_credentials -d client_id=smoke -d client_secret=smoke-secret \
            -d resource=config-server http://localhost:18455/oauth/token | grep -q access_token
          docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/mini-idp-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        if: startsWith(github.ref, 'refs/tags/mini-idp-v')
        uses: docker/build-push-action@v6
        with:
          context: services/mini-idp/server/build/install/server
          file: services/mini-idp/docker/Dockerfile
          build-contexts: docker=services/mini-idp/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
