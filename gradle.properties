# Mirrors the siblings. Configuration cache is on across the family; build-script changes may
# need `--no-configuration-cache` while iterating.
org.gradle.configuration-cache=true

# Release identity, read by every module and the published POMs. The version is the NEXT version;
# a vX.Y.Z git tag on HEAD overrides it (see settings.gradle.kts and RELEASING.md).
version=0.1.0-SNAPSHOT
# The Maven groupId of every published artifact. Deliberately NOT the Gradle "group" property:
# leaf project names repeat (services:mini-idp:core / services:mini-kms:core, both "core"), and two
# projects with the same group and name are one module to Gradle's dependency resolution, so one
# would silently replace the other on a classpath. Projects keep their default, path-derived
# groups; only the publications use this one (each with an explicit, unique artifactId).
mavenGroup=com.codeheadsystems
